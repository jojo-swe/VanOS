name: Privacy guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-guard:
    name: privacy-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block personal files and keywords
        env:
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
        run: bash scripts/privacy-guard.sh
